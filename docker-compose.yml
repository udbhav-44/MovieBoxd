services:
  app:
    build: .
    restart: unless-stopped
    environment:
      # Required. Without APP_PASSWORD the site is open to anyone who finds it.
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
    volumes:
      - movieboxd-data:/app/data
    # Not published to the host: Caddy is the only way in.
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  movieboxd-data:
  caddy-data:
  caddy-config:
